name: Deploy Docs
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, charts/**]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - run: pip install mkdocs-material
      - run: mkdocs build
      - name: Package Helm chart and build index
        run: |
          mkdir -p site/charts
          helm package charts/gobehost-operator/ -d site/charts/
          helm repo index site/charts/ --url https://alienascension.github.io/gobehost-operator/charts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment