replicaCount: 1

image:
  repository: linusdb/gobehost
  pullPolicy: IfNotPresent
  tag: "v0.1.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

manager:
  metrics:
    bindAddress: "0"
  healthProbe:
    bindAddress: ":8081"
  webhook:
    port: 9443

certmanager:
  enabled: true